# B층(운전 상황) 로컬 관련성 판정. 스니펫 기준. 상황성(불편·니즈)은 LLM이 판정하고, 여기선 차량 맥락·광고만 거른다.
# '차' 단독은 유모차·녹차 등 오매칭이 많아 쓰지 않는다.
require:
  car_context: '운전|주차|자동차|차량|운행|시동|신차|내\s?차|차를|차가|차에서|차로|차는|SUV|세단|전기차|하이브리드|블박|블랙박스|카시트|차박|내비|네비|충전기|충전소|하이패스|고속도로|현대|기아|제네시스|테슬라|쏘렌토|카니발|그랜저|싼타페|투싼|팰리세이드|스포티지|쏘나타|아반떼|캐스퍼|아이오닉|EV\d|K\d'
negative_any: '장기렌트|무심사|저신용|신불자|오토바이|바이크|견적\s?문의|원고료|체험단|협찬|팝니다|판매합니다|매물|주행거리\s?:|연식\s?:|차량\s?기본\s?정보|분양|모델하우스|운전연수\s?(전문|업체|문의)|도로연수\s?(전문|업체)|렌트카\s?(전문|업체)'
