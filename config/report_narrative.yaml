# 보고서 문안 (2026-10-10, k=6 결과 기준 초안 — 수치는 data/output/tables 근거, 팀 검토 필요)
title: 현대차 FoD 데이터 기반 페르소나 (텍스트 1차)
insights:
  - headline: 가장 큰 덩어리는 '앱으로 차를 다루는' 경험이고, 실망과 만족이 팽팽하다
    evidence: 커넥티드 관리자 34.7% / 원격제어 언급 36%(전체 대비 2.8배) / 사용 단계 실망 47% vs 만족 44%
  - headline: FoD 구매 판단은 '계산'의 언어로 이뤄진다
    evidence: 구매 결정자 32.2% / 구매 단계 망설임 45%·본전 계산 25% / 금액 언급 2.1배
  - headline: 아이 동승 세그먼트는 생애단계가 가장 뚜렷하고, 문제는 '공간과 반복'이다
    evidence: 아이 동승 부모 12.7% / 영유아 75%·학령기 23%(단서 보유 71%) / #카시트두개공간맘 40%·#라이딩지친부모 24%
  - headline: 사제 시장이 FoD의 숨은 경쟁자다 — 돈을 낼 의향은 이미 사제 장착으로 증명됐다
    evidence: 사제 대체파 6.6% / 대체 행동=사제 장착 69%(11.4배) / 기회 지수 1위 #신차꾸밈합리파 0.51
  - headline: 레저·적재는 니즈는 크지만 FoD 언급이 거의 없는 공백 지대다
    evidence: 짐·레저 이동족 9.6% / FoD 직접 글 0% / #캠핑짐테트리스 19%·#평평잠자리차박러 10%(차박 대체 행동 39%)
  - headline: 주차는 작지만 가장 아픈 순간이고, FoD를 써 본 글은 대체로 만족한다
    evidence: 좁은 주차 세그먼트 4.2% / 강도 2 이상 74%(1.7배) / 이 세그먼트 FoD 사용 단계 글 만족 67%(n=112)
segments:
  1:
    name: 앱으로 차를 다루는 커넥티드 관리자
    hashtag: "#먹통원격좌절러"
    one_liner: 원격 공조·시동·차량 상태를 폰으로 챙기지만, 앱이 막히면 가장 먼저 화가 난다
    insight:
      - 원격 제어(36%)·차량 관리(26%)·화면 꾸미기(16%)가 함께 나타나는 '차를 기기처럼 다루는' 집단. 먹통·재로그인 니즈의 부정 비율이 95%에 이른다.
      - 유료 커넥티드를 쓰는 만큼 품질 기대가 높아, FoD 판단이 '앱 신뢰'에 묶여 있다.
    features:
      - 원격 제어 36%(전체 대비 2.8배) → 이 집단에게 차의 첫 접점은 운전석이 아니라 앱
      - "#먹통원격좌절러 13%, 부정 95% → 기능이 아니라 '작동 신뢰'가 구매 장벽"
      - 사용 단계 실망 47% vs 만족 44% → 같은 기능에서 경험이 갈린다
    boundary: 앱 리뷰 비중이 높아 불만이 과대 대표될 수 있음. 연령·성별은 단서 2% 미만으로 판단 불가.
  3:
    name: 옵션·구독을 계산하는 구매 결정자
    hashtag: "#옵션고민첫차족"
    one_liner: 차를 사거나 바꿀 때 옵션·구독·유지비를 한 장부에 놓고 본전을 따진다
    insight:
      - 주행보조(3.0배)·비용(2.7배)·교체(2.7배)가 겹친다. FoD를 '살까 말까'의 계산 대상으로 다룬다.
      - 단서가 있는 글 중 첫차 50%·신혼 20% — 큰 지출을 앞둔 생애 전환점에 몰려 있다(단서 보유 17%).
    features:
      - 구매 단계 망설임 45%·본전 계산 25% → 결정 직전의 정보 부족이 장벽
      - 금액 언급 11%(2.1배) → 가격 비교 근거를 직접 원한다
      - 생애단계 단서 중 첫차 50%·신혼 20% → 첫 구매·결혼이 FoD 판단의 순간
    boundary: 테슬라·전기차 카페 비중이 커 EV·FSD 관점이 강함. 생애단계는 단서 보유 17% 기준.
  2:
    name: 아이를 태우는 부모 운전자
    hashtag: "#카시트두개공간맘"
    one_liner: 카시트·유모차·학원 라이딩으로 매일 차를 '아이 기준'으로 쓴다
    insight:
      - 아이 동승이 100%인 집단. 카시트 공간(40%)과 라이딩 피로(24%)가 핵심.
      - 단서 보유 71%로 생애단계가 유일하게 판정 가능 — 영유아 75%, 학령기 23%.
    features:
      - 영유아 75%·학령기 23%(단서 보유 71%) → 연령대 추정이 가능한 유일한 세그먼트
      - "#카시트두개공간맘 40% → 차 선택과 승하차의 기준이 카시트"
      - 니즈 주체가 아이 12%(7.0배) → 결제자와 사용자가 다른 FoD 시나리오
    boundary: 맘카페 중심이라 여성 단서가 많으나 성별 단서 보유 13%로 판단 불가. FoD 직접 글 5%.
  4:
    name: 짐과 레저를 싣는 공간 활용족
    hashtag: "#캠핑짐테트리스"
    one_liner: 캠핑 짐·유모차·골프백·휠체어까지, 차를 '공간'으로 쓴다
    insight:
      - 레저(9.2배)·적재(8.4배)가 겹치는 집단. 차박·캠핑·육아 짐·부모님 휠체어가 같은 '공간' 문제로 묶인다.
      - FoD 직접 언급이 0%인 공백 — 기존 FoD 상품이 이 순간을 다루지 않는다.
    features:
      - 레저 52%(9.2배)·적재 58%(8.4배) → 공간·전력이 핵심 자원
      - "#평평잠자리차박러 대체 행동 39% → 사제·DIY로 이미 해결 중"
      - 단서 중 영유아 66%·부모 돌봄 27% → 짐의 주인이 아이와 부모
    boundary: 캠핑·맘카페 표본 중심. FoD 반응 데이터가 없어 저니 장벽은 판단 불가.
  0:
    name: 사제로 채우는 기능 보충파
    hashtag: "#신차꾸밈합리파"
    one_liner: 순정에 없는 기능을 사제 원격시동·멀티팩·무시동히터로 채운다
    insight:
      - 대체 행동=사제 장착 69%(11.4배). 기능에 돈을 쓸 의향은 이미 있다 — 순정 FoD와 가격·신뢰로 경쟁한다.
      - 원격 시동(16%)·구형 화면 업그레이드(14%)·무시동 차박(11%)이 FoD 후보와 정확히 겹친다.
    features:
      - 사제 장착 69%(11.4배) → FoD의 직접 경쟁자
      - "#신차꾸밈합리파 기회 지수 0.51(전체 1위) → 가장 큰 텍스트 기회 신호"
      - 남성 단서 80%(단서 보유 3%) → 성별은 참고만
    boundary: 단서 보유율이 낮아 인구통계 판단 불가. 업체 홍보 글이 일부 섞였을 수 있음.
  5:
    name: 좁은 주차장의 문콕 방어자
    hashtag: "#범인찾기억울러"
    one_liner: 문콕·빈자리 찾기·좁은 칸 승하차가 일상의 가장 아픈 순간이다
    insight:
      - 좁은 주차(23배)에 집중된 작은 집단이지만 강도 2 이상 74%로 가장 아프다.
      - 이 세그먼트의 FoD 사용 단계 글(n=112)은 만족 67% — 써 보면 장벽이 낮아진다.
    features:
      - 강도 2 이상 74%(1.7배) → 빈도는 낮아도 고통이 큼
      - "#범인찾기억울러 기회 지수 0.50 → 감시·기록 기능 수요"
      - FoD 사용 단계 만족 67%(n=112) → 체험이 구매를 만든다
    boundary: 규모 4.2%로 작음. 생애단계 단서 보유 9%로 판단 불가.
ideas:
  - segment: 1
    title: 원격 실행 보증 + 출근 루틴 공조
    needs: ["#먹통원격좌절러", "#미리시원원해러"]
    concept: 원격 명령이 실패하면 자동 재시도·결과 알림을 주고, 요일·시간 루틴으로 공조를 예약한다
    specifics: ["순간: 출근 10분 전·혹한·폭염", "접점: 앱 위젯 + 실패 시 푸시", "과금: 커넥티드 요금 안에 포함, 루틴은 시즌권"]
    experiment: 실패 알림 유무에 따른 유료 전환율·앱 평점 A/B
  - segment: 1
    title: 내 차 건강 리포트
    needs: ["#정차떨림탐정", "#교체주기헷갈러"]
    concept: 소모품 주기·이상 징후를 차량 데이터로 요약해 정비 판단을 돕는다
    specifics: ["순간: 정비 시즌·이상 소리", "접점: 월간 앱 리포트", "과금: 연간권"]
    experiment: 리포트 열람률과 블루링크 연장률 비교
  - segment: 3
    title: 7일 체험권 + '내 차 되나' 체크
    needs: ["#구독구매고민러", "#내차되나확인러"]
    concept: 구매 전 호환성 확인과 7일 무료 체험을 한 흐름으로 묶는다
    specifics: ["순간: 출고 직후·무료기간 종료 전", "접점: 앱 스토어 상품 페이지", "과금: 체험 후 월·평생 선택"]
    experiment: 체험권 제공 여부별 구매 전환율
  - segment: 3
    title: 평생권 vs 월 구독 계산기 + 계정 이전
    needs: ["#구독료아까운러", "#옵션고민첫차족"]
    concept: 보유 기간·사용 빈도로 손익을 보여 주고, 차를 바꾸면 계정으로 이전되는 옵션을 제공한다
    specifics: ["순간: 구매 결정 직전", "접점: 상품 페이지 계산기", "과금: 이전 가능 평생권(프리미엄)"]
    experiment: 계산기 노출 시 평생권 선택률·이탈률
  - segment: 2
    title: 키즈 모드 패키지
    needs: ["#카시트두개공간맘", "#캐릭터화면키즈"]
    concept: 카시트 승하차 때 원격 전후진으로 문 열 공간을 만들고, 뒷좌석에 캐릭터 테마·안내를 띄운다
    specifics: ["순간: 등원·마트 주차", "접점: 스마트키·앱 + 뒷좌석 화면", "과금: 아이 연령 기간권(예: 3년)"]
    experiment: 맘카페 체험단 대상 기간권 구매 의향
  - segment: 2
    title: 라이딩 대기 모드
    needs: ["#라이딩지친부모", "#픽업대기맘"]
    concept: 학원 앞 대기 중 공조 유지·방전 보호·스트리밍을 한 번에 켠다
    specifics: ["순간: 학원 픽업 대기", "접점: IVI 원터치", "과금: 월 구독 또는 학기권"]
    experiment: 학기권 vs 월 구독 선호(설문 MaxDiff)
  - segment: 4
    title: 차박·유틸리티 모드
    needs: ["#평평잠자리차박러", "#무시동차박캠퍼"]
    concept: 무시동 공조·실내 전력·배터리 보호를 묶은 숙박 모드
    specifics: ["순간: 캠핑장 밤", "접점: IVI + 앱 상태 확인", "과금: 1박권·시즌권"]
    experiment: 시즌권 가격 수용도(Van Westendorp)
  - segment: 4
    title: 적재 도우미
    needs: ["#캠핑짐테트리스", "#휠체어모심효자", "#유모차번쩍육아맘"]
    concept: 트렁크 열 때 2열 원격 폴딩·적재 공간 안내(HW 있는 차종)
    specifics: ["순간: 짐 싣기", "접점: 트렁크 버튼·앱", "과금: 평생권(저가)"]
    experiment: HW 탑재 차종에서 평생권 구매율
  - segment: 0
    title: 순정 원격시동 시즌권
    needs: ["#어디서든시동러", "#혹한아침출근러"]
    concept: 사제 원격시동 대비 가격으로 겨울 시즌권을 제공한다
    specifics: ["순간: 혹한 아침", "접점: 앱", "과금: 겨울 시즌권(사제 장착비 대비 가격 표시)"]
    experiment: 사제 가격 대비 표시 유무에 따른 구매율
  - segment: 0
    title: 구형 화면 업그레이드 패키지
    needs: ["#구형화면살리기", "#내맘대로감성러"]
    concept: 구형 인포테인먼트에 테마·지도 업데이트를 묶어 판매한다
    specifics: ["순간: 연식 차이를 느낄 때", "접점: 앱 스토어", "과금: 평생권"]
    experiment: 구형 차종 대상 사전 예약 수요
  - segment: 5
    title: 주차 감시·문콕 알림
    needs: ["#범인찾기억울러", "#문콕공포러"]
    concept: 주차 중 충격 감지 시 영상 저장·앱 알림을 준다(빌트인캠 연동)
    specifics: ["순간: 마트·아파트 주차", "접점: 앱 푸시", "과금: 월 구독"]
    experiment: 1개월 무료 후 유지율
  - segment: 5
    title: 원격 주차 1일권
    needs: ["#좁은칸탈출러", "#빈자리헤매러"]
    concept: 좁은 주차장 방문일에만 원격 스마트 주차 보조를 1일 단위로 연다
    specifics: ["순간: 처음 가는 좁은 주차장", "접점: 목적지 설정 시 제안", "과금: 1일권 → 월 구독 전환"]
    experiment: 1일권 사용자 중 월 구독 전환율
