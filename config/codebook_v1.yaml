# FoD 페르소나 코드북 v1 (2026-10-09). v0 → v1: 정답 300건 + 3개 모델 불일치 분석 반영.
# 변경: layer 경계 규칙 보강, S_NAV·S_MAINTAIN·J_TRIAL 추가, S_FAMILY_SHARE 확장, J_USE·T_WANT·T_CALCULATE 정의 구체화.
# 원칙: 글에 근거 문장이 있을 때만 코드를 붙인다. 코드마다 원문 그대로의 근거 인용(evidence)을 남긴다.
version: v1
unit: "게시글 1건(제목+본문/스니펫). 한 글에 여러 코드 가능."
evidence_rule: "evidence는 원문에서 그대로 복사한 부분 문자열(10~80자). 요약·의역 금지. 근거가 없으면 코드를 붙이지 않는다."

families:
  layer:
    definition: "이 글이 어떤 재료인가. 단일 선택."
    values:
      A_FOD: "FoD·커넥티드 구독에 대한 작성자 본인의 경험·의견·질문·요구. 대상: 블루링크/기아 커넥트/제네시스 커넥티드 요금제, 블루링크 스토어·기아 커넥트 스토어 상품, 현대·기아 FoD 판매 대상 기능(원격 스마트 주차 보조, 디스플레이 테마, 라이팅 패턴, 스트리밍, 스마트 회생 시스템 플러스, 아케이드 게임), 타사 FSD·EAP·열선 등 구독 기능"
      B_SITUATION: "FoD 언급은 없거나 부차적이고, 운전·차량 사용 상황의 불편·니즈·습관이 작성자 경험으로 드러남"
      INFO: "판매 목적이 아닌 정보 전달만: 뉴스 전재, 출시·가격표·트림 정리, 사용법 안내, 산업 전망. 작성자 본인 경험·의견이 없음"
      EXCLUDE: "차량과 무관, 매물·판매·구매 희망글, 판매 목적 홍보(딜러·튜닝샵·렌트·업체·자작 앱 홍보), 스팸, 차량과 무관한 구독, 상황·의견이 전혀 없는 한 줄 평(예: 좋아요, 별로)"
    boundary_rules:
      - "뉴스를 퍼와도 작성자 의견이 한 문장 이상 붙어 있으면 A_FOD/B_SITUATION."
      - "구매 후기 리뷰(기아 커넥트 스토어·앱 리뷰)는 짧아도 본인 경험이므로 A_FOD."
      - "FoD 판매 대상 기능(원격 스마트 주차 보조 등)에 대한 요구·불만·사용기는 출고 옵션으로 달린 경우에도 A_FOD."
      - "스토어(블루링크 스토어·기아 커넥트 스토어)를 한 번이라도 평가·언급하면 A_FOD."
      - "커넥티드 앱(마이현대·기아 앱·MY GENESIS)의 원격 제어·차량 상태·UI 사용 경험은 B_SITUATION(S_REMOTE_CTRL). 단 유료·구독·요금·무료기간을 언급하면 A_FOD."
      - "정보성 글(칼럼·블로그)이라도 작성자 본인의 판단·권유·반감이 한 문장 이상 있으면 정보 대상에 따라 A_FOD 또는 B_SITUATION."
      - "INFO와 EXCLUDE는 둘 다 분석에서 빠진다. 헷갈리면 판매 목적 여부로만 가른다."

  situation:  # 군집 입력. A·B 공통. 0개 이상.
    definition: "작성자가 처한 운전·차량 사용 상황 또는 그 상황의 니즈."
    choose_when: "상황이 구체적으로 서술될 때. 기능 이름만 나열된 경우는 붙이지 않는다."
    values:
      S_PARK_TIGHT: "좁은 칸·옆차·벽 때문에 타고 내리기 어려움, 문콕 걱정"
      S_PARK_SKILL: "주차 실력·초보·평행/기계식/후진 주차의 어려움"
      S_PARK_REMOTE: "원격 주차·원격 전후진을 쓰거나 원함"
      S_CHILD: "아이 동승: 카시트, 등하원·학원 픽업, 아이용 화면·콘텐츠"
      S_FAMILY_SHARE: "다른 운전자·여러 대: 초보 배우자, 부모님, 가족 공용, 운전자별 설정, 한 계정에 차 여러 대·세컨카"
      S_LONG_DRIVE: "장거리·피로: 졸음, 명절·여행, 출퇴근 정체"
      S_WEATHER: "날씨·계절: 예열·선공조, 성에, 눈길·빗길"
      S_REMOTE_CTRL: "폰으로 차 제어·상태 확인: 원격 시동·공조·문, 차량 상태, 디지털키"
      S_ENTERTAIN: "차 안 엔터테인먼트·대기 시간: 스트리밍, 영상, 게임, 음악"
      S_PERSONAL: "개인화·꾸미기: 디스플레이 테마, 라이팅, 캐릭터·스포츠팀 팬심"
      S_SECURITY: "보안·안심: 도난, 빌트인캠·블랙박스, 주차 중 감시"
      S_EV: "전기차 특유: 회생제동, 충전, 주행거리, 원페달"
      S_ADAS: "주행 보조·자율주행: FSD, 고속도로 주행보조, 차선 변경"
      S_REPLACE: "차 교체·매각·보유 기간: 교체 고민, 중고로 팔 때, 오래 타기"
      S_COST: "차 관련 돈 계산: 월 고정비, 보험 할인 상계, 옵션값, 유지비"
      S_NAV: "내비·지도: 내비 품질, 지도·내비 업데이트(OTA 포함), 길안내, 음성 검색"
      S_MAINTAIN: "정비·관리: 소모품 교체 주기, 점검, 배터리·12V, 고장 자가 수리, 운전 습관·운행 기록"

  journey:  # A_FOD 전용. 0개 이상.
    definition: "FoD 상품과의 접점 단계(킥오프 저니)."
    values:
      J_DISCOVER: "FoD·스토어를 처음 알게 됨, 존재를 모르고 있었음"
      J_UNDERSTAND: "무엇인지·가격·구독 구조를 이해하려 함"
      J_CHECK: "내 차·내 트림·내 주차장에서 되는지, 적용 차종이 언제 확대되는지 확인"
      J_TRIAL: "무료 체험·짧은 구독·할인·0원 상품으로 일단 써 보고 결정(체험 후 해지·환불·일시불 전환 포함)"
      J_PURCHASE: "구매 결정·결제 순간, 할인·이벤트로 구매"
      J_ACTIVATE: "설치·적용·활성화, 메뉴를 못 찾음"
      J_USE: "실제로 써 본 체감·빈도·작동 여부가 서술될 때만. 구매 예정·질문만 있으면 붙이지 않는다"
      J_MANAGE: "무료기간 종료·연장·갱신·해지 판단"
      J_SETTLE: "환불·결제 오류·위약금·포인트 결제"
      J_TRANSFER: "차를 팔거나 바꿀 때 기능 귀속·승계"
    unknown_when: "단계가 특정되지 않으면 비워 둔다."

  attitude:  # A_FOD 전용. 0개 이상.
    values:
      T_RESIST_HWLOCK: "이미 달린 하드웨어를 돈 내야 쓰게 잠근 것에 대한 반감"
      T_RESIST_DOUBLEPAY: "차값을 냈는데 또/계속 돈을 낸다는 반감, 요금 이중 부과"
      T_ACCEPT_SW: "업데이트로 새 기능이 생기는 것엔 낼 만하다는 수용"
      T_HESITATE: "살까 말까 망설임, 가격 대비 고민"
      T_SATISFIED: "써 보니 만족"
      T_DISAPPOINT: "써 보니 실망·기대 미달·작동 불만"
      T_DISTRUST: "고지·자동결제·해지 절차에 대한 불신"
      T_CALCULATE: "금액·사용 빈도 대비 값어치·본전·다른 요금(보험·OTT·타사)과 비교가 명시될 때"
      T_OWNERSHIP_WORRY: "차량 귀속·양도·평생권 범위에 대한 우려"
      T_WANT: "기능·디자인·차종 지원·가격 정책을 명시적으로 요청하거나 바람(~해주세요, ~했으면)"

  life_stage:  # 단일 선택. 본문 자기 진술·생애 사건만. 채널·차종으로 추정 금지.
    values:
      L_FIRSTCAR: "첫차, 사회초년생, 자취, 운전 초보 본인"
      L_INFANT: "영유아 자녀 또는 임신 중(카시트, 유모차, 어린이집, 아기, 임신)"
      L_SCHOOLKID: "초·중·고 자녀(학원, 등하교, 초딩)"
      L_EMPTYNEST: "자녀 독립·대학생 자녀, 부모님 모시기, 은퇴"
      L_UNKNOWN: "단서 없음 (기본값)"
  gender:
    values: {G_F: "남편·시댁 등 여성 단서", G_M: "와이프·아내·장인 등 남성 단서", G_UNKNOWN: "단서 없음 (기본값)"}

output_schema:  # 1건당
  id: str
  layer: "A_FOD|B_SITUATION|INFO|EXCLUDE"
  situation: [codes]
  journey: [codes]
  attitude: [codes]
  life_stage: code
  gender: code
  evidence: "{code: 원문 인용}  # situation·journey·attitude·life_stage·gender 각 코드마다"
  confidence: "high|low  # 판단이 갈릴 만하면 low"
  note: "선택. 코드북에 없는 니즈가 보이면 기록(코드북 보강용)"
